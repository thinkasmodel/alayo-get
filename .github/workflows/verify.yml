# CI 门：push 到 main 与 PR 都跑仓根 verify.sh full（typecheck + lint + test + 生产构建 + manifest 检查）。
# 第三方 Action 锁到 commit SHA（ALAG-19）；token 只读。
name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash verify.sh full
