<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Small promo tile</title>
<link rel="stylesheet" href="store.css">
<style>
html,body{width:440px;height:280px}
.tile{position:relative;width:440px;height:280px;background:var(--canvas);padding:40px 40px 0;display:flex;flex-direction:column;gap:18px;overflow:hidden}
.tile .icon{width:64px;height:64px}
.tile h1{margin:0;font-size:30px;line-height:36px;font-weight:600;letter-spacing:-.3px}
.tile p{margin:0;font-size:16px;line-height:23px;color:var(--t2);max-width:340px}
.tile .fileline{position:absolute;left:40px;bottom:28px;font-family:var(--mono);font-size:11.5px;color:var(--t3)}
</style>
</head>
<body>
<div class="tile">
  <svg class="icon" viewBox="0 0 64 64" fill="none"><rect x="3" y="3" width="58" height="58" rx="17" fill="#4257B5"/><path d="M32 14v24M21 28l11 11 11-11" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="50" r="4.5" fill="#FFFFFF"/></svg>
  <div>
    <h1>Alayo Get</h1>
    <p style="margin-top:6px">Save web pages, X threads, media and quotes as plain Markdown files in a folder you choose.</p>
  </div>
  <div class="fileline">Designing for calm - notes on interface restraint.md</div>
</div>
</body>
</html>
